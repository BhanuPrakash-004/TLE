version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tle-postgres-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ragnarok_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragnarok_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
