version: '3.8'

# ==============================================================================
# Docker Compose — PostgreSQL 16 + pgvector (local development backend)
#
# Usage:
#   docker compose up -d           start in background
#   docker compose logs -f         tail logs
#   docker compose down            stop & remove containers (data persists)
#   docker compose down -v         also wipe the persistent volume
#
# Set DB_BACKEND=docker in .env to use this instance.
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tle-postgres-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-ragnarok_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ragnarok_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: tle_postgres_data
